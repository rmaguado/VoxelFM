name: segmentation_default
output_dir: runs/segmentation
num_workers: 16
seed: 4

data:
  embeddings_path: /path/to/embeddings
  masks_path: /path/to/masks
  splits_path: /path/to/splits
  feature_key: patch
  noise_p: 0.2
  noise_sigma: 0.1

training:
  batch_size: 1
  grad_accum_steps: 16
  weight_decay: 0.01

scheduler:
  num_epochs: 120
  warmup_epochs: 20
  cosine_epochs: 100
  min_lr: 1e-4
  max_lr: 1e-3

model:
  embed_dim: 864
  target_shape: [112, 112, 112]
  num_classes: 118
  hidden_dim: 64
  num_steps: 3